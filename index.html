  if(keys.ArrowLeft||keys.a)tx-=7;if(keys.ArrowRight||keys.d)tx+=7;
  tx=Math.max(CH_W/2,Math.min(W-CH_W/2,tx));
  px+=(tx-px)*0.25;
  spawn--;if(spawn<=0){addItem();spawn=Math.max(13,36-(30-timeLeft())*0.65)}
  const bx=px,by=GY-CH_H*0.45;
  for(const it of items){
    it.y+=it.vy;it.rot+=it.vr;
    if(!it.done&&it.y>by-6&&it.y<by+16&&Math.abs(it.x-bx)<40){
      it.done=1;
      if(it.type==='bean'){score++;pop(it.x,by,'#f2c94c')}
      else if(it.type==='gold'){score+=5;pop(it.x,by,'#ffd700')}
      else{score-=5;pop(it.x,by,'#888')}
    }else if(!it.done&&it.y>H+10){
      it.done=1;
      
    }
  }
  items=items.filter(i=>!i.done);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.l--});parts=parts.filter(p=>p.l>0);
  if(timeLeft()<=0){
    running=false;
    if(score>best){best=score;try{localStorage.setItem('bean_best',best)}catch(e){}}
    ov.querySelector('h1').textContent='時間到!';
    ov.querySelector('p').innerHTML='你接到了 <b style="font-size:28px">'+score+'</b> 分!';
    go.textContent='再玩一次';ov.style.display='flex';bestEl.textContent='🏆 最高分:'+best;
  }
}
function drawItem(it){
  ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);
  if(it.type==='gold'){
    ctx.fillStyle='#f3c76b';ctx.strokeStyle='#7a4a14';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.roundRect(-17,-10,34,20,9);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e0a040';[[-8,-4],[-2,4],[6,-3]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],2,0,7);ctx.fill()});
    ctx.fillStyle='#fff1b8';ctx.beginPath();ctx.ellipse(15,0,5,9,0,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#8bc34a';ctx.beginPath();ctx.arc(15,-3,1.8,0,7);ctx.arc(15,3,1.8,0,7);ctx.fill();
  }else if(it.type==='rock'){
    ctx.fillStyle='#8a8a8a';ctx.strokeStyle='#333';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(-12,6);ctx.lineTo(-8,-8);ctx.lineTo(4,-11);ctx.lineTo(13,-2);ctx.lineTo(9,9);ctx.closePath();ctx.fill();ctx.stroke();
  }else{
    ctx.fillStyle=it.type==='gold'?'#ffd700':'#f4d35e';ctx.strokeStyle=it.type==='gold'?'#b8860b':'#9a7b1c';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.ellipse(0,0,10,13,0,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(-3,-4,2.5,4,0,0,7);ctx.fill();
    if(it.type==='gold'){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(10,-14);ctx.lineTo(10,-8);ctx.moveTo(7,-11);ctx.lineTo(13,-11);ctx.stroke()}
  }
  ctx.restore();
}
function drawBasket(x,y){
  // back rim
  ctx.fillStyle='#8a5a1f';ctx.strokeStyle='#4a2e0c';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(x-46,y);ctx.lineTo(x+46,y);ctx.lineTo(x+34,y+36);ctx.quadraticCurveTo(x,y+44,x-34,y+36);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.save();ctx.clip();
  ctx.strokeStyle='#c28a3a';ctx.lineWidth=2;
  for(let i=-50;i<50;i+=10){ctx.beginPath();ctx.moveTo(x+i,y);ctx.lineTo(x+i*0.75,y+44);ctx.stroke()}
  for(let j=8;j<44;j+=10){ctx.beginPath();ctx.moveTo(x-50,y+j);ctx.lineTo(x+50,y+j);ctx.stroke()}
  ctx.restore();
  ctx.fillStyle='#b97a2c';ctx.strokeStyle='#4a2e0c';ctx.lineWidth=3;
  ctx.beginPath();ctx.roundRect(x-50,y-5,100,10,5);ctx.fill();ctx.stroke();
  // beans in basket
  const n=Math.min(score,12);ctx.fillStyle='#f4d35e';
  for(let i=0;i<n;i++){ctx.beginPath();ctx.ellipse(x-36+(i%6)*14.5,y-7-Math.floor(i/6)*5,5,4,0,0,7);ctx.fill()}
}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#bfe8ff');g.addColorStop(1,'#fff3c4');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.globalAlpha=.8;
  [[70,80,26],[110,86,20],[300,130,24],[335,136,18]].forEach(c=>{ctx.beginPath();ctx.arc(c[0],c[1],c[2],0,7);ctx.fill()});ctx.globalAlpha=1;
  ctx.fillStyle='#8bc34a';ctx.fillRect(0,H-18,W,18);
  // character
  const bob=Math.sin(t/8)*(running?2:0);
  if(img.complete&&img.naturalWidth){
    const ar=img.naturalWidth/img.naturalHeight,h=CH_H+10,w=h*ar;
    ctx.drawImage(img,px-w/2,GY-h+bob,w,h);
  }
  drawBasket(px,GY-CH_H*0.45);
  items.forEach(drawItem);
  parts.forEach(p=>{ctx.globalAlpha=p.l/25;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill()});ctx.globalAlpha=1;
  // HUD
  ctx.fillStyle='#5a3d00';ctx.font='bold 24px sans-serif';ctx.textAlign='left';ctx.fillText('分數 '+score,14,34);
  ctx.textAlign='right';ctx.fillStyle=timeLeft()<=10?'#d32f2f':'#5a3d00';ctx.fillText('⏱ '+Math.ceil(timeLeft())+' 秒',W-12,34);
}
function loop(){update();draw();requestAnimationFrame(loop)}
reset();running=false;bestEl.textContent=best?'🏆 最高分:'+best:'';
loop();
</script>
